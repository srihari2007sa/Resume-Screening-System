# Google Cloud Build configuration for Cloud Run
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/resume-screening-system:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/resume-screening-system:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'resume-screening-system', 
           '--image', 'gcr.io/$PROJECT_ID/resume-screening-system:$COMMIT_SHA', 
           '--region', 'us-central1', 
           '--platform', 'managed',
           '--allow-unauthenticated',
           '--set-env-vars', 'GROQ_API_KEY=$$GROQ_API_KEY,SPRING_PROFILES_ACTIVE=production',
           '--memory', '512Mi',
           '--cpu', '1000m',
           '--max-instances', '10']

# Store images in Google Container Registry
images: ['gcr.io/$PROJECT_ID/resume-screening-system:$COMMIT_SHA']

# Substitute environment variables
substitutions:
  _GROQ_API_KEY: 'your_api_key_here'