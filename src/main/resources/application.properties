# Spring Application Name
spring.application.name=ai-resume-screener

# Default Database configuration (File-based H2 for persistent development without setup)
spring.datasource.url=jdbc:h2:file:./data/resumedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 web console (localhost only — never expose this to other hosts in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload Size Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Server Port
server.port=8081

# Profile selection: uncomment below to activate MySQL profile defined in application-mysql.properties
spring.profiles.active=mysql

# Google Gemini Developer API Key
# Get your key at: https://aistudio.google.com/apikey  (must start with AIza...)
# Set via environment variable: GEMINI_API_KEY=AIzaSy...
# Or replace the fallback value below directly for local development
gemini.api.key=${GEMINI_API_KEY:}

