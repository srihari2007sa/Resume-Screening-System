# ── Production profile (used when SPRING_PROFILES_ACTIVE=prod) ──
# All sensitive values come from environment variables set in Railway dashboard.
# Never hardcode secrets here.

# ── Database (Railway MySQL plugin variable names) ──
# Railway injects: MYSQL_URL, MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
# We build the JDBC URL from individual parts since Railway's MYSQL_URL is not JDBC format
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:resume_screener_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ── JPA ──
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Server — Railway injects PORT env var ──
server.port=${PORT:8081}

# ── Disable H2 console in production ──
spring.h2.console.enabled=false

# ── File Upload ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Gemini API Key ──
gemini.api.key=${GEMINI_API_KEY:}

# ── Logging ──
logging.level.root=WARN
logging.level.com.resumescreening=INFO

# ── Actuator (health endpoint for Railway) ──
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
