# ── Production profile (used when SPRING_PROFILES_ACTIVE=prod) ──
# All sensitive values come from environment variables set in Railway dashboard.
# Never hardcode secrets here.

# ── Database (Railway MySQL plugin injects MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD) ──
spring.datasource.url=${MYSQL_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/resume_screener_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${MYSQL_USER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQL_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ── JPA ──
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Server — Railway injects PORT env var ──
server.port=${PORT:8081}

# ── Disable H2 console in production ──
spring.h2.console.enabled=false

# ── File Upload ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Gemini API Key ──
gemini.api.key=${GEMINI_API_KEY:}

# ── Logging ──
logging.level.root=WARN
logging.level.com.resumescreening=INFO

# ── Actuator (health endpoint for Railway) ──
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
