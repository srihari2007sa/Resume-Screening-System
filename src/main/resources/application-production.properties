# Production deployment configuration (Render, Railway, etc.)
server.port=${PORT:8081}

# MySQL Database Configuration for Production
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/resume_screening_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# MySQL JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Production logging
logging.level.com.resumescreening=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Production actuator (for health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always