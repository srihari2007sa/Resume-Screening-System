# Production deployment configuration (Render, Railway, etc.)
server.port=${PORT:8081}

# H2 Database for production (file-based for persistence)
spring.datasource.url=jdbc:h2:file:./data/resumedb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable H2 Console in production for security
spring.h2.console.enabled=false

# Production JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Production logging
logging.level.com.resumescreening=INFO
logging.level.org.hibernate=WARN

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Production actuator (for health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always