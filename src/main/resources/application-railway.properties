# Railway deployment specific
# Production overrides for application.properties
server.port=${PORT:8081}

# Production Database (Railway provides DATABASE_URL or we use H2 file)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/resumedb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Production H2 Console (disable for security in production)
spring.h2.console.enabled=false

# Production JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Production logging
logging.level.com.resumescreening=INFO
logging.level.org.hibernate=WARN

# File upload limits for Railway
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Production actuator (for health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always