# MySQL Local Development Configuration
server.port=8081

# MySQL Database Configuration for Local Development
spring.datasource.url=jdbc:mysql://localhost:3306/resume_screening_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=srihari2007sa
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# MySQL JPA settings - creates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development logging
logging.level.com.resumescreening=DEBUG
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Development actuator
management.endpoints.web.exposure.include=health,info,beans,env
management.endpoint.health.show-details=always