# MySQL Configuration Profile
# To activate this profile, set 'spring.profiles.active=mysql' in application.properties
#
# Set credentials via environment variables (never hardcode passwords in source files):
#   DB_USERNAME=root
#   DB_PASSWORD=your_password_here

spring.datasource.url=jdbc:mysql://localhost:3306/resume_screener_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Dialect for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
